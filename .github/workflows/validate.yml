name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-shell:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck server/*.sh client-unix/*.sh

  lint-json:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          python3 -c "import json, glob; [json.load(open(f)) for f in glob.glob('**/*.json', recursive=True)]"

  lint-powershell:
    name: PowerShell Analyzer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./desktop-windows -Recurse -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          if ($results) {
              $results | Format-Table -AutoSize
              exit 1
          }

  security-scan:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Real Tokens
        run: |
          if grep -rE 'ghp_[A-Za-z0-9]{36}' .; then
            echo "::error::Detected raw GitHub personal access token!"
            exit 1
          fi